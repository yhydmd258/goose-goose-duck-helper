<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹅鸭杀新手助手 - 完整版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
    
    /* 头部 */
    .header { 
      background: linear-gradient(135deg, #16213e, #0f3460); 
      padding: 20px; 
      text-align: center;
      border-bottom: 3px solid #e94560;
    }
    .header h1 { font-size: 32px; color: #e94560; margin-bottom: 8px; }
    .header p { color: #aaa; font-size: 14px; }
    .stats { 
      display: flex; 
      justify-content: center; 
      gap: 20px; 
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .stat-item { 
      background: rgba(255,255,255,0.1); 
      padding: 8px 16px; 
      border-radius: 20px;
      font-size: 13px;
    }
    
    /* 标签页 */
    .tabs { 
      display: flex; 
      justify-content: center; 
      gap: 8px; 
      padding: 16px; 
      background: #16213e;
      flex-wrap: wrap;
    }
    .tab { 
      padding: 10px 24px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 15px;
      background: #0f3460; 
      color: #aaa; 
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab.active { background: #e94560; color: #fff; }
    .tab:hover { opacity: 0.85; }
    
    /* 主容器 */
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 20px;
    }
    
    /* 搜索和筛选 */
    .controls { 
      background: #16213e; 
      padding: 16px; 
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #222;
    }
    .search-box { 
      width: 100%; 
      padding: 12px 16px; 
      border-radius: 8px; 
      border: 1px solid #333;
      background: #0f3460; 
      color: #eee; 
      font-size: 15px; 
      margin-bottom: 16px;
    }
    .search-box::placeholder { color: #666; }
    .filter-row { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 12px; 
      flex-wrap: wrap;
    }
    .filter-btn { 
      padding: 6px 16px; 
      border-radius: 20px; 
      border: 1px solid #444; 
      background: transparent;
      color: #aaa; 
      cursor: pointer; 
      font-size: 13px; 
      transition: all 0.2s;
    }
    .filter-btn.active { 
      background: #e94560; 
      color: #fff; 
      border-color: #e94560;
    }
    
    /* 角色卡片网格 */
    .roles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    
    /* 角色卡片 */
    .card { 
      background: #16213e; 
      border-radius: 12px; 
      padding: 20px;
      border: 1px solid #222; 
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    
    /* 卡片标题区域 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .card-title { 
      font-size: 18px; 
      font-weight: 600; 
      color: #e94560;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-subtitle { 
      font-size: 13px; 
      color: #888; 
      margin-top: 4px;
    }
    
    /* 徽章 */
    .badge { 
      display: inline-block; 
      padding: 3px 10px; 
      border-radius: 12px; 
      font-size: 11px; 
      font-weight: 500;
    }
    .badge-goose { background: #1b5e20; color: #a5d6a7; }
    .badge-duck { background: #b71c1c; color: #ef9a9a; }
    .badge-neutral { background: #e65100; color: #ffcc80; }
    .badge-easy { background: #2e7d32; color: #a5d6a7; }
    .badge-medium { background: #f57c00; color: #ffcc80; }
    .badge-hard { background: #d32f2f; color: #ef9a9a; }
    .badge-very_hard { background: #6a1b9a; color: #ce93d8; }
    
    /* 卡片内容 */
    .card-body { 
      font-size: 14px; 
      color: #ccc; 
      line-height: 1.6;
    }
    .section { 
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #222;
    }
    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .section-title { 
      font-size: 14px; 
      color: #e94560; 
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title::before {
      content: "▶";
      font-size: 10px;
    }
    
    /* 列表样式 */
    .info-list {
      list-style: none;
      padding-left: 0;
    }
    .info-list li {
      margin-bottom: 6px;
      padding-left: 16px;
      position: relative;
    }
    .info-list li::before {
      content: "•";
      color: #e94560;
      position: absolute;
      left: 0;
    }
    
    /* 标签云 */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      background: rgba(233, 69, 96, 0.2);
      color: #ff8fa3;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    
    /* 空状态 */
    .empty { 
      text-align: center; 
      color: #666; 
      padding: 60px 20px;
      grid-column: 1 / -1;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    /* 页脚 */
    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
      border-top: 1px solid #222;
      margin-top: 30px;
    }
    
    /* 响应式调整 */
    @media (max-width: 768px) {
      .roles-grid {
        grid-template-columns: 1fr;
      }
      .header h1 { font-size: 24px; }
      .stats { gap: 10px; }
      .stat-item { padding: 6px 12px; font-size: 12px; }
      .tab { padding: 8px 16px; font-size: 14px; }
    }
    
    /* 难度指示器 */
    .difficulty-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
    }
    .difficulty-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .difficulty-dot.easy { background: #2e7d32; }
    .difficulty-dot.medium { background: #f57c00; }
    .difficulty-dot.hard { background: #d32f2f; }
    .difficulty-dot.very_hard { background: #6a1b9a; }
    
    /* 阵营图标 */
    .faction-icon {
      font-size: 18px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦆 鹅鸭杀新手助手 - 完整版</h1>
    <p>Goose Goose Duck Helper — 53个角色完整数据 · 详细策略 · 实战技巧</p>
    <div class="stats">
      <div class="stat-item">🦢 鹅阵营: 20个角色</div>
      <div class="stat-item">🦆 鸭阵营: 22个角色</div>
      <div class="stat-item">⚖️ 中立阵营: 11个角色</div>
      <div class="stat-item">📊 总计: 53个角色</div>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="roles">
      <span>👑</span> 角色查询
    </button>
    <button class="tab" data-tab="factions">
      <span>🏆</span> 阵营说明
    </button>
    <button class="tab" data-tab="strategies">
      <span>🎯</span> 高级策略
    </button>
    <button class="tab" data-tab="search">
      <span>🔍</span> 智能搜索
    </button>
  </div>
  
  <div class="container">
    <!-- 角色查询面板 -->
    <div id="roles-panel" class="panel visible">
      <div class="controls">
        <input class="search-box" id="roleSearch" placeholder="搜索角色名称、技能或俗语..." />
        <div class="filter-row">
          <button class="filter-btn active" data-faction="all">全部阵营</button>
          <button class="filter-btn" data-faction="goose">🦢 鹅阵营</button>
          <button class="filter-btn" data-faction="duck">🦆 鸭阵营</button>
          <button class="filter-btn" data-faction="neutral">⚖️ 中立阵营</button>
        </div>
        <div class="filter-row">
          <button class="filter-btn active" data-difficulty="all">全部难度</button>
          <button class="filter-btn" data-difficulty="easy">🟢 简单</button>
          <button class="filter-btn" data-difficulty="medium">🟡 中等</button>
          <button class="filter-btn" data-difficulty="hard">🔴 困难</button>
          <button class="filter-btn" data-difficulty="very_hard">💀 极难</button>
        </div>
      </div>
      
      <div class="roles-grid" id="roleList">
        <!-- 角色卡片将通过JavaScript动态生成 -->
      </div>
    </div>
    
    <!-- 其他面板将通过JavaScript动态生成 -->
    <div id="other-panels"></div>
  </div>
  
  <div class="footer">
    <p>数据更新于: 2026年4月10日 | 共收录53个角色 | 游戏版本: Goose Goose Duck v2.0+</p>
    <p>提示: 点击角色卡片查看详细信息，使用搜索框可以搜索角色名称、技能描述或俗语黑话</p>
  </div>
  
  <script type="module">
    import { roleService } from './src/services/RoleService.js';
    
    const app = {
      currentTab: 'roles',
      currentFaction: 'all',
      currentDifficulty: 'all',
      searchQuery: '',
      
      init() {
        this.bindEvents();
        this.renderRoles();
      },
      
      bindEvents() {
        // 标签页切换
        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            this.currentTab = tab.dataset.tab;
            this.renderPanel();
          });
        });
        
        // 阵营筛选
        document.querySelectorAll('[data-faction]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-faction]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentFaction = btn.dataset.faction;
            this.renderRoles();
          });
        });
        
        // 难度筛选
        document.querySelectorAll('[data-difficulty]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-difficulty]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentDifficulty = btn.dataset.difficulty;
            this.renderRoles();
          });
        });
        
        // 搜索框
        const searchInput = document.getElementById('roleSearch');
        searchInput.addEventListener('input', (e) => {
          this.searchQuery = e.target.value.trim();
          this.renderRoles();
        });
      },
      
      renderPanel() {
        // 根据当前标签页渲染不同内容
        const panels = document.querySelectorAll('.panel');
        panels.forEach(panel => panel.classList.remove('visible'));
        
        if (this.currentTab === 'roles') {
          document.getElementById('roles-panel').classList.add('visible');
          this.renderRoles();
        } else {
          // 其他面板的渲染逻辑
          this.renderOtherPanel();
        }
      },
      
      renderRoles() {
        const roleList = document.getElementById('roleList');
        let roles = roleService.getAllRoles();
        
        // 搜索筛选
        if (this.searchQuery) {
          roles = roleService.searchByName(this.searchQuery);
        }
        
        // 阵营筛选
        if (this.currentFaction !== 'all') {
          roles = roles.filter(role => role.faction === this.currentFaction);
        }
        
        // 难度筛选
        if (this.currentDifficulty !== 'all') {
          roles = roles.filter(role => role.difficulty === this.currentDifficulty);
        }
        
        if (roles.length === 0) {
          roleList.innerHTML = `
            <div class="empty">
              <div class="empty-icon">🔍</div>
              <h3>未找到匹配的角色</h3>
              <p>尝试使用其他关键词或调整筛选条件</p>
            </div>
          `;
          return;
        }
        
        // 渲染角色卡片
        roleList.innerHTML = roles.map(role => this.renderRoleCard(role)).join('');
      },
      
      renderRoleCard(role) {
        const factionIcon = role.faction === 'goose' ? '🦢' : 
                          role.faction === 'duck' ? '🦆' : '⚖️';
        const factionClass = `badge-${role.faction}`;
        const difficultyClass = `badge-${role.difficulty}`;
        const difficultyLabel = role.difficulty === 'easy' ? '简单' :
                              role.difficulty === 'medium' ? '中等' :
                              role.difficulty === 'hard' ? '困难' : '极难';
        
        return `
          <div class="card" data-role-id="${role.id}">
            <div class="card-header">
              <div>
                <div class="card-title">
                  <span class="faction-icon">${factionIcon}</span>
                  ${role.name}
                  <span class="difficulty-indicator">
                    <span class="difficulty-dot ${role.difficulty}"></span>
                    <span class="badge ${difficultyClass}">${difficultyLabel}</span>
                  </span>
                </div>
                <div class="card-subtitle">${role.nameEn}</div>
              </div>
              <span class="badge ${factionClass}">
                ${role.faction === 'goose' ? '鹅阵营' : 
                  role.faction === 'duck' ? '鸭阵营' : '中立阵营'}
              </span>
            </div>
            
            <div class="card-body">
              <div class="section">
                <div class="section-title">技能描述</div>
                <p>${role.skillDescription}</p>
              </div>
              
              <div class="section">
                <div class="section-title">常用策略</div>
                <ul class="info-list">
                  ${role.commonStrategies.map(strategy => `<
